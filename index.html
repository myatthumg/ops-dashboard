<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Data Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300..900;1,300..900&display=swap">
<style>[hidden]{display:none!important}</style>
<style>
/* Layout: a single macOS window on a quiet wallpaper. Translucent source-list sidebar, unified toolbar, scrolling content, right-hand inspector, sheets for upload/check/delete. */
:root{
  --wall-a:#b9c7d3; --wall-b:#d9d3e2; --wall-c:#c4d6d0;
  --win:#f5f5f7; --side:rgba(229,230,236,.92); --bar:rgba(245,245,247,.92);
  --surface:#ffffff; --surface-2:#f0f0f3; --hover:rgba(20,22,40,.05); --sel:rgba(0,122,255,.12);
  --line:rgba(20,22,40,.11); --line-2:rgba(20,22,40,.06);
  --fg:#1c1c21; --fg-2:#565863; --fg-3:#868893;
  --blue:#0068d6; --green:#1f7f37; --orange:#b85f00; --red:#cc1220; --purple:#8340a6; --teal:#0b7488; --pink:#c11d4b; --indigo:#4a43c4; --yellow:#946b00;
  --shadow:0 24px 70px rgba(28,34,58,.28),0 0 0 .5px rgba(0,0,0,.2);
  --pop:0 12px 40px rgba(20,24,40,.22),0 0 0 .5px rgba(0,0,0,.14);
  --font:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --num:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mm:"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN",var(--font);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall-a:#17202c; --wall-b:#271f30; --wall-c:#14262a;
  --win:#1d1d20; --side:rgba(40,40,45,.9); --bar:rgba(33,33,37,.94);
  --surface:#27272b; --surface-2:#222225; --hover:rgba(255,255,255,.055); --sel:rgba(10,132,255,.22);
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.06);
  --fg:#f2f2f5; --fg-2:#aeb0ba; --fg-3:#80828c;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#40c8e0; --pink:#ff375f; --indigo:#7d7aff; --yellow:#ffd60a;
  --shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.14);
  --pop:0 12px 40px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.14);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --wall-a:#17202c; --wall-b:#271f30; --wall-c:#14262a;
  --win:#1d1d20; --side:rgba(40,40,45,.9); --bar:rgba(33,33,37,.94);
  --surface:#27272b; --surface-2:#222225; --hover:rgba(255,255,255,.055); --sel:rgba(10,132,255,.22);
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.06);
  --fg:#f2f2f5; --fg-2:#aeb0ba; --fg-3:#80828c;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#40c8e0; --pink:#ff375f; --indigo:#7d7aff; --yellow:#ffd60a;
  --shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.14);
  --pop:0 12px 40px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.14);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 var(--font);color:var(--fg);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 700px at 12% 0%,var(--wall-c),transparent 60%),radial-gradient(900px 700px at 100% 100%,var(--wall-b),transparent 60%),var(--wall-a);
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;text-transform:capitalize}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:1px;border-radius:6px}
.num,.big{font-variant-numeric:tabular-nums}

/* window */
.win{position:relative;height:100%;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--win);overflow:hidden}
.win.fs{grid-template-columns:0 minmax(0,1fr)}
.win.fs .side{visibility:hidden}
.win.fs .content{padding:28px 40px 56px}
.win.fs .hero h1{font-size:32px}
.win.fs .kpi .big,.win.fs .rcard .cnt{font-size:34px}
.fsbadge{display:none;font-size:11px;font-weight:600;color:var(--green);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:10px;padding:1px 8px;margin-left:8px;vertical-align:1px}
.win.fs .fsbadge{display:inline-block}
@media (min-width:1600px){.win.fs .kpis{grid-template-columns:repeat(8,minmax(0,1fr))}}
.win.nosb{grid-template-columns:0 minmax(0,1fr)}
.win.nosb .side{visibility:hidden}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lights{display:flex;gap:8px;padding:18px 18px 12px}
.lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.lights button{width:12px;height:12px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18);background:#28c840;display:grid;place-items:center;color:transparent}
.lights:hover button{color:rgba(0,0,0,.55)}
.lights button svg{width:8px;height:8px}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.sfind{margin:4px 12px 10px;display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;background:var(--hover);border:0;color:var(--fg-3);text-align:left;width:calc(100% - 24px)}
.sfind kbd{margin-left:auto;font:11px var(--font);color:var(--fg-3)}
.snav{flex:1;overflow:auto;padding:0 10px 10px}
.sgroup{font-size:11px;font-weight:600;color:var(--fg-3);padding:14px 8px 4px}
.sitem{display:flex;align-items:center;gap:9px;width:100%;padding:5px 8px;border:0;background:none;border-radius:6px;text-align:left;font-size:13px}
.sitem:hover{background:var(--hover)}
.sitem.on{background:var(--sel)}
.sitem .ico{width:18px;height:18px;display:grid;place-items:center;color:var(--c,var(--blue))}
.sitem .ico svg{width:16px;height:16px}
.badge{margin-left:auto;min-width:20px;padding:0 6px;height:18px;border-radius:9px;font:600 11px/18px var(--font);text-align:center;background:color-mix(in srgb,var(--fg) 10%,transparent);color:var(--fg-2)}
.badge.hot{background:var(--red);color:#fff}
.sfoot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;background:linear-gradient(135deg,#5e8bff,#a56bff)}
.sfoot small{display:block;color:var(--fg-3);font-size:11px}

/* main */
.main{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:52px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:0;background:none;color:var(--fg-2);white-space:nowrap}
.tbtn:hover{background:var(--hover);color:var(--fg)}
.tbtn svg{width:16px;height:16px;flex:none}
.tbtn.icon{width:30px;padding:0;justify-content:center}
.tbtn.pri{background:var(--blue);color:#fff;font-weight:500}
.tbtn.pri:hover{background:color-mix(in srgb,var(--blue) 88%,#000)}
/* Give the Excel template and destructive day-delete actions clear, visible backgrounds */
.tbtn[data-act="tpl"]{background:var(--blue);color:#fff;border:1px solid var(--blue);font-weight:600}
.tbtn[data-act="tpl"]:hover{background:color-mix(in srgb,var(--blue) 86%,#000);color:#fff}
.tbtn[data-act="del"]{background:var(--red);color:#fff;border:1px solid var(--red);font-weight:600}
.tbtn[data-act="del"]:hover{background:color-mix(in srgb,var(--red) 86%,#000);color:#fff}
.ttl{min-width:0;margin-right:auto;padding-left:4px}
.ttl b{display:block;font-size:13px;font-weight:600}
.ttl small{display:block;color:var(--fg-3);font-size:11px}
.seg{display:inline-flex;background:var(--hover);border-radius:7px;padding:2px}
.seg button{border:0;background:none;height:24px;padding:0 8px;border-radius:5px;color:var(--fg-2);display:inline-flex;align-items:center}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.16)}
.vsep{width:1px;height:20px;background:var(--line);margin:0 2px}
.content{overflow:auto;min-height:0;padding:24px 28px 56px}
.mnav{display:none;gap:6px;overflow-x:auto;margin:-6px 0 18px;padding-bottom:4px}
.mnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;height:28px;padding:0 12px}
.mnav button.on{background:var(--blue);color:#fff;border-color:transparent}

/* hero */
.hero{padding:22px 24px;border-radius:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--teal) 14%,var(--surface)),color-mix(in srgb,var(--indigo) 12%,var(--surface)));border:1px solid var(--line-2);margin-bottom:28px}
.hero h1{margin:0 0 12px;font:700 28px/1.15 var(--num);letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{color:var(--fg-2);font-weight:600}
.days{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.days .dgrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.days .rng{margin-left:0;padding-left:12px;border-left:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.days .rlab{color:var(--fg-2);font-size:12px}
.days .filters{gap:7px;padding-left:12px}
.days .filters select{height:27px;min-width:82px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);padding:0 7px;font:12px var(--font)}
.days .filters select:last-child{min-width:112px}
.rngf{display:grid;gap:10px;padding:10px 10px 8px;min-width:250px}
.rngf label{display:grid;gap:4px;font-size:12px;color:var(--fg-2)}
.rngf input{height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);padding:0 8px;color:var(--fg)}
.menu .rngf .acts{display:flex;justify-content:flex-end;gap:6px;margin:0}
.menu .rngf .acts button{width:auto;display:inline-flex;justify-content:center;padding:0 12px;height:28px;border-radius:6px}
.menu .rngf .acts .btn.pri:hover{background:color-mix(in srgb,var(--blue) 88%,#000)}
.menu .rngf .acts .btn:not(.pri):hover{background:var(--surface-2);color:var(--fg)}
.dpill{flex:none}

.win.fs .days{padding-inline:40px}
.days .dgrp > span:first-child{color:var(--fg-2);margin-right:4px;font-size:12px;white-space:nowrap}
.dpill{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);height:26px;padding:0 11px;border-radius:13px;font-size:12px;color:var(--fg-2)}
.dpill:hover{color:var(--fg);border-color:color-mix(in srgb,var(--fg) 25%,transparent)}
.dpill.on{background:var(--blue);border-color:transparent;color:#fff;font-weight:500}
.summary{font-size:15px;line-height:1.55;max-width:100%;margin:0 0 8px;color:var(--fg)}
.summary b{font-variant-numeric:tabular-nums}
.meta{margin:0;color:var(--fg-3);font-size:12px}

/* sections */
section{margin-bottom:30px}
.sec-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.sec-h > div{margin-right:auto;min-width:0}
h2{margin:0;font-size:21px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
h3{margin:0;font-size:16px;line-height:1.3;font-weight:600}
.sub{margin:3px 0 0;color:var(--fg-3);font-size:12.5px}
.sec-h .sub{font-size:13px;margin-top:4px}
.link{border:0;background:none;color:var(--blue);padding:0;font-weight:500}
.link:hover{text-decoration:underline}
.btn{height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--blue);color:#fff;border-color:transparent}
.btn.red{background:var(--red);color:#fff;border-color:transparent}
.btn svg{width:14px;height:14px}
.btn:disabled{opacity:.45;cursor:default}

/* attention rings — the signature */
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rcard{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:6px 14px;align-items:center;text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:0}
.rcard:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.rcard.first{background:color-mix(in srgb,var(--c) 9%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.rwrap{position:relative;width:64px;height:64px;grid-row:span 2}
.rwrap span{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--num)}
.rcard .tn{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rcard .cnt{font:800 30px/1 var(--num);font-variant-numeric:tabular-nums}
.rcard .cnt small{font:500 12px var(--font);color:var(--fg-2);margin-left:6px}
.rcard .why{grid-column:1/-1;color:var(--fg-2);font-size:12px;min-height:34px;margin-top:4px}
.rcard .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-2);padding-top:10px;margin-top:2px;font-size:12px;color:var(--fg-3)}
.rcard .foot b{color:var(--c);font-weight:600}
.rcard .cnt small{font-size:13px}
.cats{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:0}
.cats li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13px;color:var(--fg-2)}
.cats li b{color:var(--fg);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.signed{color:var(--green)!important}

/* kpi tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;border:0;text-align:left;color:var(--fg);display:grid;grid-template-columns:1fr auto;gap:2px 10px;min-width:0}
.kpi:hover{background:var(--surface-2)}
.kpi .kl{grid-column:1/-1;font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.kpi .big{font:700 26px/1.1 var(--num)}
.kpi .kd{grid-column:1/-1;font-size:12.5px;color:var(--fg-3)}
.kpi svg.spark{align-self:end}

/* panels & tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel > .ph{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 12px;flex-wrap:wrap}
.panel > .ph > div:first-child{margin-right:auto;min-width:0}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.toggle{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:none;color:var(--fg-2);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.toggle.on{background:color-mix(in srgb,var(--orange) 16%,transparent);border-color:color-mix(in srgb,var(--orange) 45%,transparent);color:var(--orange);font-weight:500}
.chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:none;color:var(--fg-2);font-size:12px}
.chip.on{background:var(--fg);color:var(--win);border-color:transparent}

.filterbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;padding:0 16px 12px}
.flt{display:grid;gap:3px;min-width:125px;font-size:11px;color:var(--fg-3)}
.flt select,.flt input{height:30px;max-width:190px;min-width:125px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);padding:0 8px;font:12px var(--font)}
.searchflt input{min-width:190px}.filtercount{padding:0 16px 9px;color:var(--fg-3);font-size:11px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);color:var(--fg-2);font-size:12px}
.pager-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pager button{height:34px;min-width:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:600 12px var(--font)}
.pager button:disabled{opacity:.35;cursor:not-allowed}.pager button.active{background:var(--surface-2);border-color:var(--line-strong,var(--line));color:var(--navy,var(--fg))}.pager .sizes{display:flex;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:24px;gap:3px}.pager .sizes button{border:0;border-radius:20px;background:transparent;min-width:38px}.pager .sizes button.active{background:var(--surface);box-shadow:0 1px 3px #0002}.pager input{width:58px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);text-align:center;font:13px var(--font)}.pager .go{background:#20395e;color:white;border-color:#20395e}

.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12.5px;font-weight:600;color:var(--fg-2);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;white-space:nowrap}
td.wrap,td.mm{white-space:normal;min-width:200px}
th.n,td.n{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr.is-attn td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
.attn-cell{color:var(--orange);font-size:12.5px;min-width:220px;max-width:300px}
tbody tr.is-flag td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tbody tr.is-sel td{background:var(--sel)}
tfoot td{font-weight:650;border-bottom:0;background:var(--surface-2)}
tr.grp th{text-align:center;font-size:13px;border-bottom:0;padding-bottom:0}
td.chk,th.chk{width:34px;padding-right:0}
td.mm{font-family:var(--mm);line-height:1.8;min-width:340px}
td .reason{display:block;white-space:normal;font-size:11px;color:var(--orange);margin-top:2px;max-width:220px}
.rowact{white-space:nowrap;text-align:right;width:1%}
.ib{width:26px;height:24px;border:1px solid transparent;border-radius:6px;background:none;color:var(--fg-3);display:inline-grid;place-items:center}
.ib:hover{background:var(--surface-2);border-color:var(--line);color:var(--fg)}
.ib.v:hover{color:var(--green)}.ib.f:hover{color:var(--red)}
.ib svg{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.bad{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.pill.mute{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg-3);font-weight:500}
.pill.info{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.pill.c{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.bulk{display:flex;align-items:center;gap:8px;margin:0 16px 10px;padding:6px 6px 6px 12px;border-radius:8px;background:var(--sel);font-size:12px;flex-wrap:wrap}
.bulk b{margin-right:auto}
.empty{padding:28px 16px;text-align:center;color:var(--fg-3)}
.empty b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}
.search{flex:1;min-width:200px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}

/* team header */
.team-h{display:flex;gap:16px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.t5 th{padding:10px 16px;background:var(--surface-2)}

const TEAMS = {
  rma:{name:'RMA',c:'var(--pink)',desc:'Splicer and OTDR repairs, vendor returns and release'},
  gng:{name:'GNG',c:'var(--indigo)',desc:'Go / No-Go QC for fiber implementation projects'}
};
const TEAM_IDS = Object.keys(TEAMS);
const VIEWS = {overview:'Overview',...Object.fromEntries(TEAM_IDS.map(t=>[t,TEAMS[t].name]))};

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum = (a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const pct = (n,d)=>d?Math.round(n/d*1000)/10:0;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const toD = k=>new Date(k+'T00:00:00');
const kOf = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(k,n)=>{const d=toD(k);d.setDate(d.getDate()+n);return kOf(d)};
const dlabel = k=>{const d=toD(k);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const dshort = k=>{const d=toD(k);return `${d.getDate()} ${MON[d.getMonth()]}`};
const dlong = k=>`${dshort(k)} ${toD(k).getFullYear()}`;
const nowT = ()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const planCls = p=>p>=90?'ok':p>=70?'warn':'bad';

/* ---------- state ---------- */
const TODAY_KEY = localUploadDay(new Date().toISOString()); // Dashboard day follows Asia/Yangon, not the computer timezone.
const INITIAL_DAYS = Array.from({length:7},(_,i)=>addDays(TODAY_KEY,-i));
const S = {days:INITIAL_DAYS, allDays:INITIAL_DAYS.slice(), day:TODAY_KEY, year:TODAY_KEY.slice(0,4), month:'all',
  view:'overview', viewAllDays:false, val:{}, signoff:{}, sel:{}, attnOnly:{}, rmaF:'win', gngF:'win', rmaFilters:{}, gngFilters:{}, rmaSearch:'', gngSearch:'', pager:{'rma-cases':{size:20,page:1},'gng-jobs':{size:20,page:1}}, eqGroup:'team', theme:'auto', insp:null, cache:{}, uploads:{}, user:null, _uploadDataset:'rma'};
try{ const t=localStorage.getItem('odp-theme'); if(t) S.theme=t; if(localStorage.getItem('odp-nosb')==='1') $('#win').classList.add('nosb'); }catch(e){}

/* ---------- sample data (generated per report day; 28 Oct mirrors the sample report) ---------- */
/* RMA sheet (RMA_for_Portal.xlsx). Dates were normalised on import: day/month swaps were resolved with the Months and Release Months columns.
   0 sheet row, 1 received, 2 inbound team, 3 sender, 4 sender ID, 5 team manager, 6 device, 7 type, 8 main board S/N, 9 body S/N, 10 status category,
   11 issue, 12 detail resolution, 13-15 changing resolutions, 16 outbound from Inv RMA, 17 inbound to Inv RMA, 18 user error, 19 adapter, 20 vendor,
   21 send to procurement, 22 receive from procurement, 23 inbound to Inv Main, 24 outbound by cross team, 25 release date, 26 outbound person,
   27 outbound ID, 28 detail remark, 29 estimate saved (MMK), 30 current in-hand team, 31 final status */
const RMA_SLA={team:30,vendor:90};
function rangeBounds(k){return {from:'0000-01-01',to:k};}
const dY=v=>`${dshort(v)} ${v.slice(0,4)}`;
function rangeShort(k){return 'All time'}
function rangeIn(k){return 'across all time'}
const rangeKey=()=>'all';
function applyReportDayRange(){
  const source=S.allDays.length?S.allDays:INITIAL_DAYS;
  const years=[...new Set(source.map(k=>k.slice(0,4)))].sort().reverse();
  if(!years.includes(S.year))S.year=years[0]||TODAY_KEY.slice(0,4);
  const yearDays=source.filter(k=>k.slice(0,4)===S.year);
  const months=[...new Set(yearDays.map(k=>k.slice(5,7)))];
  if(S.month!=='all'&&!months.includes(S.month))S.month='all';
  const periodDays=yearDays.filter(k=>S.month==='all'||k.slice(5,7)===S.month);
  if(S.viewAllDays){
    S.days=periodDays;
  }else{
    // Always show seven consecutive calendar dates, including dates with no upload.
    // With All Months selected, the seven-day window can cross a month boundary.
    let anchor=periodDays[0];
    if(!anchor){
      const mm=Number(S.month==='all'?'12':S.month);
      anchor=`${S.year}-${String(mm).padStart(2,'0')}-${String(new Date(Number(S.year),mm,0).getDate()).padStart(2,'0')}`;
    }
    S.days=Array.from({length:7},(_,i)=>addDays(anchor,-i));
    if(S.month!=='all')S.days=S.days.filter(k=>k.slice(5,7)===S.month);
  }
  if(S.days.length&&!S.days.includes(S.day))S.day=S.days[0];
}
const RSTAGE=['In team repair','At vendor','Done, not released','Completed','Failed','Released, no status'];
const RSTAGE_C=['var(--teal)','var(--indigo)','var(--blue)','var(--green)','var(--red)','var(--fg-3)'];
const shortIssue=v=>(v||'').replace(/^(Splicer|OTDR)\s*:\s*/i,'');
let RMA_RAW=[];
let GNG_RAW=[];
let RMA_UPLOAD_RAW=[];
let GNG_UPLOAD_RAW=[];
const isDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'');
const dayDiff=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
function rmaFor(k){
  // The selected report day is the upload day, not the sheet's
  // Received Date. Keep exactly the rows uploaded on that day.
  const all=RMA_RAW.filter(x=>x.uploadDay===k).map(x=>{
    const [row,recv,inTeam,sender,senderId,manager,device,type,sn,bodySn,statusCat,issue,resolution,ch1,ch2,ch3,outRMA,inRMA,userErr,adapter,vendor,sendProc,recvProc,inMain,outCross,release,outPerson,outId,remark,saved,inhand,final]=x;
    const released=isDate(release)&&release<=k;
    const status=String(final||statusCat||'').toLowerCase();
    let st=0;
    if(released) st=5;
    else if(/fail|scrap|unrepair|reject/.test(status)) st=4;
    else if(/complete|done|repair(ed)?/.test(status)) st=3;
    else if(/vendor|procurement/.test(String(vendor||'')+' '+String(inhand||''))) st=1;
    else if(vendor&&!recvProc) st=1;
    else if(/release/.test(status)) st=2;
    const age=isDate(recv)?Math.max(0,dayDiff(recv,k)):0, vdays=vendor&&sendProc?dayDiff(sendProc,recvProc&&recvProc<=k?recvProc:k):0;
    const open=!released&&st!==4;
    const over=open&&age>RMA_SLA.team;
    const r={id:'r'+row,row,recv,inTeam,sender,senderId,manager,device,type,sn,bodySn,statusCat,issue,resolution,
      changes:[ch1,ch2,ch3].filter(Boolean).join('; '),outRMA,inRMA,userErr,adapter,vendor,sendProc,recvProc,inMain,outCross,
      release:released?release:'',outPerson,outId,remark,saved,inhand,final,st,age,open,over,vdays,visit:1};
    return r;
  }).sort((a,b)=>(b.recv||'').localeCompare(a.recv||'')||b.row-a.row);
  return {all,win:all};
}
function rmaNums(D){
  const all=D.rma.all, w=D.rma.win;
  const open=all.filter(r=>r.open);
  const team=open.filter(r=>r.st===0);
  const vendor=open.filter(r=>r.st===1);
  const ready=open.filter(r=>r.st===2||r.st===3);
  const rel=w.filter(r=>r.release);
  const comp=rel.filter(r=>/complete|done|repair(ed)?/i.test(String(r.final||r.statusCat||'')));
  const fail=rel.filter(r=>/fail|scrap|unrepair|reject/i.test(String(r.final||r.statusCat||'')));
  const over=open.filter(r=>r.over);
  const recvW=w.filter(r=>r.recv>=rangeBounds(D.k).from&&r.recv<=rangeBounds(D.k).to);
  const durations=comp.map(r=>dayDiff(r.recv,r.release)).filter(n=>n>=0);
  const avg=durations.length?Math.round(durations.reduce((a,b)=>a+b,0)/durations.length*10)/10:0;
  const saved=rel.reduce((n,r)=>n+(Number(String(r.saved||'').replace(/[^0-9.-]/g,''))||0),0)/1000000;
  const bySn={};
  all.filter(r=>r.sn).forEach(r=>{const key=String(r.sn).trim().toLowerCase();(bySn[key]||(bySn[key]=[])).push(r)});
  Object.values(bySn).forEach(rows=>{rows.sort((a,b)=>a.recv.localeCompare(b.recv));rows.forEach((r,i)=>r.visit=i+1)});
  w.forEach(r=>{
    const notes=[]; let score=0;
    if(!r.sn){notes.push('S/N missing');score=Math.max(score,5)}
    if(r.open&&r.st===0&&r.age>RMA_SLA.team){notes.push(`In team repair for ${r.age} days`);score=Math.max(score,Math.min(14,6+r.age/10))}
    if(r.open&&r.st===1&&r.vdays>RMA_SLA.vendor){notes.push(`At ${r.vendor||'vendor'} for ${r.vdays} days`);score=Math.max(score,Math.min(14,6+r.vdays/10))}
    if(r.open&&r.st>=2&&r.age>RMA_SLA.team){notes.push(`not released after ${r.age} days`);score=Math.max(score,7)}
    if(r.visit>1){notes.push('Repeat repair');score=Math.max(score,8)}
    if(r.release&&r.release<r.recv){notes.push('Release date is before received date');score=Math.max(score,8)}
    if(r.release&&!r.final&&!r.statusCat){notes.push('Released without final status');score=Math.max(score,5)}
    if(!r.statusCat&&!r.final){notes.push('No status recorded');score=Math.max(score,3)}
    r.attn=notes.join('; ');r.score=score;
  });
  return {all,open,team,vendor,ready,over,rel,comp,fail,recvW,avg,saved:Math.round(saved*10)/10};
}

function gngFor(k){
  const {from,to}=rangeBounds(k);
  const seen=d=>isDate(d)&&d<=k?d:(isDate(d)?'':d);   /* dates after the report day have not happened yet */
  const all=GNG_RAW.filter(x=>x[13]<=k).map(x=>{
    const [no,project,tsp,team,olt,ca1,ca2,otb,mode,overall,lqc,gqc,nqc,submit,failDate,fixDate,goDate,link,fixLink,remark]=x;
    const r={id:'g'+no,no,project,tsp,team,olt,ca1,ca2,otb,mode,overall,lqc,gqc,nqc,submit,failDate:seen(failDate),fixDate:seen(fixDate),goRaw:goDate,link,fixLink,remark};
    r.goDate=isDate(goDate)&&goDate<=k?goDate:'';
    r.dec=/cancel|no ?go/i.test(remark)?'No-Go':r.goDate?'Go':isDate(goDate)?'Scheduled':'Pending';
    r.age=dayDiff(submit,k);
    r.lead=r.goDate?dayDiff(submit,r.goDate):null;
    r.fails=[['Result',overall],['Logical QC',lqc],['Ground QC',gqc],['NOC QC',nqc]].filter(q=>q[1]==='Fail').map(q=>q[0]);
    r.inWin=submit>=from&&submit<=to;
    const a=[]; let sc=0; const add=(t,v)=>{a.push(t);sc=Math.max(sc,v)};
    if(r.inWin){
      if(r.dec==='Go'&&r.fails.length) add(`Go given with failed ${r.fails.join(', ')}`,14);
      if(r.fails.length&&r.dec!=='Go'&&r.dec!=='No-Go'&&!r.fixDate) add(`QC failed (${r.fails.join(', ')}); fix data not submitted`,12);
      if(r.dec==='Pending'&&r.age>5) add(`No Go/No-Go decision ${r.age} days after submit`,6+Math.min(r.age,40)/10);
      if(isDate(goDate)&&goDate<submit) add('Go/No-Go date is before the submit date',8);
      if(lqc==='Inprogress') add('Logical QC still in progress',5);
      if(!link) add('No data link in the sheet',5);
    }
    r.attn=a.join('; '); r.score=sc; return r;
  }).sort((a,b)=>b.submit.localeCompare(a.submit)||b.no-a.no);
  return {all,win:all.filter(r=>r.inWin)};
}

function data(k){
  const ck=k+'|'+rangeKey(); if(S.cache[ck]) return S.cache[ck];
  const base = k==='2026-10-28', seed=+k.replace(/-/g,'');
  const r = mulberry(seed), r2 = mulberry(seed*7+3);
  const J=(v,a)=>base?v:Math.max(0,v+Math.round((r()-.5)*2*a));
  const pick=(a,rr=r)=>a[Math.floor(rr()*a.length)];
  const prev = addDays(k,-1), md=k.slice(5).replace('-','');

  const up = S.uploads[k] || {file:`Operation_Daily_Report (${String(toD(k).getDate()).padStart(2,'0')}-${MON[toD(k).getMonth()]}-${toD(k).getFullYear()}).xlsx`,at:`${k.slice(8)}/${k.slice(5,7)}/${k.slice(0,4)}, ${base?'10:56:15':'10:4'+Math.floor(r()*10)+':0'+Math.floor(r()*10)}`};

  return S.cache[ck] = {k,prev,rma:rmaFor(k),gng:gngFor(k),up};
}

/* ---------- table definitions: one source for team pages, queue, inspector, search, export ---------- */
function tables(d){
  return {
    rma:[{id:'rma-cases',team:'rma',title:'RMA Repairs',sub:`From the RMA sheet, newest first. Open repairs plus anything received or released ${rangeIn(d.k)}. SLA: ${RMA_SLA.team} days in team repair, ${RMA_SLA.vendor} days at the vendor.`,
      rows:d.rma.win, statRows:d.rma.win, name:r=>`${r.device} · ${r.sn||'no S/N'}`,
      filter:r=>S.rmaF==='open'?r.open:S.rmaF==='over'?r.over:S.rmaF==='vendor'?r.st===1:true,cols:[
      {k:'recv',l:'Received',fmt:r=>gdate(r.recv,d.k)},{k:'inTeam',l:'From team'},{k:'sender',l:'Sender'},
      {k:'device',l:'Device'},{k:'sn',l:'Main board S/N',fmt:r=>r.sn?esc(r.sn):'<span class="pill bad">Missing</span>'},
      {k:'issue',l:'Issue',w:1,fmt:r=>esc(shortIssue(r.issue))},
      {k:'stage',l:'Stage',get:r=>RSTAGE[r.st],fmt:r=>`<span class="pill c" style="--c:${RSTAGE_C[r.st]}">${RSTAGE[r.st]}</span>`},
      {k:'vendor',l:'Vendor',fmt:r=>esc(r.vendor||'—')},

function localUploadDay(timestamp){
  if(!timestamp) return '';
  const date=new Date(timestamp);
  if(Number.isNaN(date.getTime())) return '';
  const p=new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Yangon',
    year:'numeric',
    month:'2-digit',
    day:'2-digit'
  }).formatToParts(date);
  const values=Object.fromEntries(p.map(x=>[x.type,x.value]));
  return `${values.year}-${values.month}-${values.day}`;
}
function uploadRowsForDay(rows,day){
  // Use the same upload-day rule as the RMA Repairs table.
  return rows.filter(row=>localUploadDay(row.created_at)===day).length;
}

function vRma(d){
  const R=rmaNums(d), w=d.rma.win;
  const counts=RSTAGE.map((s,i)=>w.filter(r=>r.st===i).length);
  const buckets=[['0–7',0,7],['8–14',8,14],['15–30',15,30],['31–60',31,60],['61–90',61,90],['90+',91,1e5]].map(([l,a,b])=>({l,n:R.open.filter(x=>x.age>=a&&x.age<=b).length,late:a>RMA_SLA.team}));
  const bm=Math.max(1,...buckets.map(b=>b.n));
  const tally=(arr,key)=>{const m={};arr.forEach(r=>{const v=key(r)||'Not recorded';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6)};
  const issues=tally(R.recvW,r=>shortIssue(r.issue)), teams=tally(R.recvW,r=>r.inTeam), im=Math.max(1,...issues.map(x=>x[1])), tm=Math.max(1,...teams.map(x=>x[1]));
  return teamHeader(d,'rma',`${R.open.length} tools are in repair: ${R.team.length} with the RMA team, ${R.vendor.length} at the vendor and ${R.ready.length} done but not released. ${R.over.length} ${R.over.length===1?'is':'are'} past SLA.`)+`
  ${statStrip(d,[
    {l:'In repair',f:D=>rmaNums(D).open.length,dir:-1,s:(v,D)=>{const n=rmaNums(D);return `${n.team.length} team · ${n.vendor.length} vendor · ${n.ready.length} not released`}},
    {l:'Over SLA',f:D=>rmaNums(D).over.length,dir:-1,alert:v=>v>0,s:`${RMA_SLA.team} days team, ${RMA_SLA.vendor} days vendor`},
    {l:`Released · ${rangeShort(d.k)}`,f:D=>rmaNums(D).rel.length,dir:1,s:(v,D)=>{const n=rmaNums(D);return `${n.comp.length} completed · ${n.fail.length} failed`}},
    {l:'Average repair time',f:D=>rmaNums(D).avg,dir:-1,unit:' d',fmt:v=>v+' d',s:`Completed repairs released ${rangeIn(d.k)}`},
    {l:`Estimated saving · ${rangeShort(d.k)}`,f:D=>rmaNums(D).saved,dir:1,unit:'M',fmt:v=>v+'M',s:'MMK, from released repairs'}])}
  <section class="grid32">
    <div class="panel"><div class="ph"><div><h3>Repairs by stage</h3><p class="sub">Open repairs plus repairs received or released ${rangeIn(d.k)}.</p></div></div>
      <div class="pipe">${counts.map((n,i)=>n?`<i style="flex:${n};background:${RSTAGE_C[i]}" title="${RSTAGE[i]}: ${n}">${n}</i>`:'').join('')}</div>
      <div class="pkeys">${RSTAGE.map((s,i)=>`<span><i style="background:${RSTAGE_C[i]}"></i>${s} · ${counts[i]}</span>`).join('')}</div></div>
    <div class="panel"><div class="ph"><div><h3>Age of open repairs</h3><p class="sub">Days since received. Bars right of the line are past the ${RMA_SLA.team}-day team SLA.</p></div></div>
      <div class="cols">${buckets.map(b=>`<div class="c" style="--c:${b.late?'var(--red)':'var(--pink)'}"><b>${b.n}</b><i style="height:${b.n/bm*100}px"></i></div>`).join('')}<span class="sla" style="left:calc(16px + (100% - 32px) * .5 - 7px)">SLA ${RMA_SLA.team} days</span></div>
      <div class="clabels">${buckets.map(b=>`<span>${b.l}</span>`).join('')}</div></div>
  </section>
  <section class="grid2">
    <div class="panel"><div class="ph"><div><h3>Top issues</h3><p class="sub">${R.recvW.length} tools received ${rangeIn(d.k)}.</p></div></div>
      <div class="rbars">${issues.map(([l,n])=>`<div class="rbar" style="--c:var(--pink)"><span>${esc(l)}</span><div class="track"><i style="width:${n/im*100}%"></i></div><span class="num" style="text-align:right">${n}</span></div>`).join('')}</div></div>

function gngNums(D){const w=D.gng.win, qc=w.filter(r=>r.lqc==='Pass'||r.lqc==='Fail'), go=w.filter(r=>r.lead!=null);
  return {w,wait:w.filter(r=>r.dec==='Pending'||r.dec==='Scheduled'),wait5:w.filter(r=>r.dec==='Pending'&&r.age>5),
    failed:w.filter(r=>r.fails.length),fixed:w.filter(r=>r.fails.length&&r.fixDate),goFail:w.filter(r=>r.dec==='Go'&&r.fails.length),
    week:w.filter(r=>r.age<=6),lqcPass:qc.filter(r=>r.lqc==='Pass').length,lqcN:qc.length,lqcRate:qc.length?Math.round(qc.filter(r=>r.lqc==='Pass').length/qc.length*1000)/10:0,
    lead:go.length?Math.round(go.reduce((s,r)=>s+r.lead,0)/go.length*10)/10:0,goN:go.length};}
function gngEquipment(d){
  const y=d.k.slice(0,4);
  const src=d.gng.win;
  const keyf={team:r=>r.team||'No team',tsp:r=>r.tsp||'No TSP',month:r=>r.submit.slice(0,7)}[S.eqGroup];
  const F=['olt','ca1','ca2','otb'], m={};
  src.forEach(r=>{const k=keyf(r),g=m[k]||(m[k]={k,n:0,go:0,olt:0,ca1:0,ca2:0,otb:0});g.n++;if(r.dec==='Go')g.go++;F.forEach(f=>g[f]+=(+r[f]||0))});
  const rows=Object.values(m).sort(S.eqGroup==='month'?(a,b)=>b.k.localeCompare(a.k):(a,b)=>b.n-a.n||a.k.localeCompare(b.k));
  const tot={n:src.length,go:0,olt:0,ca1:0,ca2:0,otb:0};rows.forEach(g=>{tot.go+=g.go;F.forEach(f=>tot[f]+=g[f])});
  const mx=Object.fromEntries(F.map(f=>[f,Math.max(1,...rows.map(g=>g[f]))]));
  const lab=g=>S.eqGroup==='month'?`${MON[+g.k.slice(5,7)-1]} ${g.k.slice(0,4)}`:g.k;
  const head={team:'Team',tsp:'TSP',month:'Month'}[S.eqGroup];
  const scopeTxt=`submitted ${rangeIn(d.k)}`;
  const cell=(g,f)=>g[f]?`<span class="eqv"><i style="width:${g[f]/mx[f]*100}%"></i><b>${g[f].toLocaleString('en-US')}</b></span>`:'<span class="eqv"><i style="visibility:hidden"></i><b class="eq0">0</b></span>';
  S._eqcsv=[[head,'Projects','Go given','OLT','CA1','CA2','OTB'].join(','),...rows.map(g=>[`"${lab(g).replace(/"/g,'""')}"`,g.n,g.go,g.olt,g.ca1,g.ca2,g.otb].join(',')),['Total',tot.n,tot.go,tot.olt,tot.ca1,tot.ca2,tot.otb].join(',')].join('\n');
  return `<section class="panel" id="p-gng-eq"><div class="ph"><div><h3>OLT, CA1, CA2 and OTB by ${head.toLowerCase()}</h3><p class="sub">Totals from the OLT, CA1, CA2 and OTB columns for ${src.length} projects ${scopeTxt}.</p></div>
    <div class="tools"><div class="seg" role="group" aria-label="Group by">${[['team','Team'],['tsp','TSP'],['month','Month']].map(([v,l])=>`<button class="${S.eqGroup===v?'on':''}" data-act="eqgroup" data-v="${v}" aria-pressed="${S.eqGroup===v}">${l}</button>`).join('')}</div>
      <button class="btn" data-act="eqcsv">${I.share}Copy as CSV</button></div></div>
    ${rows.length?`<div class="tscroll" style="max-height:460px;overflow:auto"><table class="eqt"><thead><tr><th>${head}</th><th class="n">Projects</th><th class="n">Go given</th>${F.map(f=>`<th class="n">${f.toUpperCase()}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(g=>`<tr><td>${esc(lab(g))}</td><td class="n">${g.n}</td><td class="n">${g.go}</td>${F.map(f=>`<td class="n">${cell(g,f)}</td>`).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="n">${tot.n}</td><td class="n">${tot.go}</td>${F.map(f=>`<td class="n">${tot[f].toLocaleString('en-US')}</td>`).join('')}</tr></tfoot></table></div>`
    :`<div class="empty"><b>No projects in this period</b>Choose a longer period at the top of the page.</div>`}
  </section>`;
}
function vGng(d){

  const mm=Math.max(1,...months.map(m=>m.n));

  return teamHeader(d,'gng',`${g.w.length} projects were submitted for Go/No-Go ${rangeIn(d.k)}. ${g.wait.length} ${g.wait.length===1?'is':'are'} waiting for a decision and ${g.goFail.length} went ahead with a failed QC.`)+`
  ${statStrip(d,[
    {l:`Submitted · ${rangeShort(d.k)}`,f:D=>gngNums(D).w.length,dir:0,s:(v,D)=>`${gngNums(D).week.length} in the last 7 days`},

    {l:'QC failed',f:D=>gngNums(D).failed.length,dir:-1,s:(v,D)=>`${gngNums(D).fixed.length} with fix data submitted`},
    {l:'Go with failed QC',f:D=>gngNums(D).goFail.length,dir:-1,alert:v=>v>0,s:'Needs a manager decision'},
    {l:'Days to Go',f:D=>gngNums(D).lead,dir:-1,unit:' d',fmt:v=>v,s:(v,D)=>`Average, submit to Go (${gngNums(D).goN} projects)`}])}

  ${gngEquipment(d)}
  <section>${tableHTML(tables(d).gng[0],[['win',`All · ${rangeShort(d.k)}`],['wait','Waiting for decision']].map(([v,l])=>`<button class="chip ${S.gngF===v?'on':''}" data-act="gngf" data-v="${v}">${l}</button>`).join(''))}</section>`;

function buildStyledTemplateSheet(headers){
  const ws = XLSX.utils.aoa_to_sheet([headers]);
  const lastCol = XLSX.utils.encode_col(headers.length - 1);
  const headerStyle = {
    font: { name: 'Arial', sz: 11, bold: true, color: { rgb: 'FFFFFF' } },
    fill: { patternType: 'solid', fgColor: { rgb: '4472C4' } },
    alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
    border: {
      top: { style: 'thin', color: { rgb: 'D9E2F3' } },
      bottom: { style: 'thin', color: { rgb: 'D9E2F3' } },
      left: { style: 'thin', color: { rgb: 'D9E2F3' } },
      right: { style: 'thin', color: { rgb: 'D9E2F3' } }
    }
  };
  headers.forEach((_, i) => {
    const cell = XLSX.utils.encode_cell({ r: 0, c: i });
    if (ws[cell]) ws[cell].s = headerStyle;
  });
  ws['!cols'] = headers.map(h => ({ wch: Math.min(34, Math.max(14, String(h).length + 4)) }));
  ws['!rows'] = [{ hpt: 34 }];
  ws['!autofilter'] = { ref: `A1:${lastCol}1` };
  ws['!freeze'] = { xSplit: 0, ySplit: 1, topLeftCell: 'A2', activePane: 'bottomLeft', state: 'frozen' };
  return ws;
}

}

function setUploadProgress(percent,status,detail,step){
  const fill=$('#uploadFill'),pct=$('#uploadPercent'),st=$('#uploadStatus'),dt=$('#uploadDetail');
  if(fill)fill.style.width=`${Math.max(0,Math.min(100,percent))}%`;
  if(pct)pct.textContent=`${Math.round(percent)}%`;
  if(st)st.textContent=status;
  if(dt)dt.textContent=detail;
  for(let i=1;i<=3;i++){const el=$(`#upStep${i}`);if(el){el.classList.toggle('done',i<step);el.classList.toggle('active',i===step);if(i<step)el.querySelector('.us-dot').textContent='✓';}}
}
async function runUpload(file,dataset){
  dataset = dataset === 'gng' ? 'gng' : 'rma';
  if(!(file instanceof File)){toast('Please choose an Excel file.');return}
  if(!S.user){S._uploadDataset=dataset;sheetLogin();return}
  if(!/\.xlsx$/i.test(file.name)){toast('Please upload an .xlsx file.');return}
  if(file.size===0||file.size>10*1024*1024){toast('File must be between 1 byte and 10 MB.');return}
  const label = dataset === 'rma' ? 'RMA' : 'Go No Go (GNG)';
  uploadProgressUI(file,label);
  const closeBtn=$('#uploadClose');if(closeBtn)closeBtn.disabled=true;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session) throw new Error('Your session expired. Please sign in again.');
    const fn=file.name.toLowerCase();
    const looksOther = dataset === 'rma' ? (fn.includes('gng')||fn.includes('go_no_go')||fn.includes('gonogo')) : fn.includes('rma');
    if(looksOther) throw new Error(`This file name looks like the other dataset. Please choose the ${label} Excel file.`);
    const fd=new FormData();fd.append('file',file);fd.append('dataset',dataset);
    setUploadProgress(3,'Connecting securely…','Preparing file transfer',1);
    const result=await new Promise((resolve,reject)=>{
      const xhr=new XMLHttpRequest();
      xhr.open('POST',SUPABASE_URL+'/functions/v1/excel-upload');
      xhr.setRequestHeader('apikey',SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Authorization','Bearer '+session.access_token);
      xhr.upload.onprogress=e=>{
        if(e.lengthComputable){
          const pct=5+(e.loaded/e.total)*75;
          setUploadProgress(pct,'Uploading Excel file…',`${Math.round(e.loaded/1024).toLocaleString()} KB of ${Math.round(e.total/1024).toLocaleString()} KB sent`,1);
          if(e.loaded>=e.total)setUploadProgress(82,'File sent. Processing…','Waiting for Supabase to validate and import rows',2);
        }else setUploadProgress(35,'Uploading Excel file…','Sending file to Supabase',1);
      };
      xhr.onload=()=>{
        let body={};try{body=JSON.parse(xhr.responseText||'{}')}catch{}
        if(xhr.status>=200&&xhr.status<300)resolve(body);
        else reject(new Error(body.error||body.message||body.details||'Upload failed.'));
      };
      xhr.onerror=()=>reject(new Error('Network error. Check your internet connection and try again.'));
      xhr.ontimeout=()=>reject(new Error('Upload timed out. Please try again.'));
      xhr.timeout=180000;
      xhr.send(fd);
    });
    setUploadProgress(88,'Import complete. Refreshing dashboard…','Loading the latest records',3);
    await loadDashboardData();
    setUploadProgress(100,'Upload successful','Dashboard data is up to date',4);
    const spinner=$('#uploadSpinner');if(spinner)spinner.style.display='none';
    const resultBox=$('#uploadResult');
    if(resultBox){resultBox.hidden=false;resultBox.className='upload-result';resultBox.textContent=`${label} upload completed successfully.${Number.isFinite(result.imported_rows)?` ${result.imported_rows} rows imported.`:''}${Number.isFinite(result.skipped_rows)&&result.skipped_rows>0?` ${result.skipped_rows} invalid or empty-ID rows skipped.`:''}`;}
    if(closeBtn){closeBtn.disabled=false;closeBtn.textContent='Done';}
    S.cache={};render();toast(`${label} Excel uploaded successfully.`);
  }catch(ex){
    const msg=ex.message||'Upload failed.';
    const spinner=$('#uploadSpinner');if(spinner)spinner.style.display='none';
    const st=$('#uploadStatus');if(st)st.textContent='Upload could not be completed';
    const detail=$('#uploadDetail');if(detail)detail.textContent='Please check the error below';
    const resultBox=$('#uploadResult');if(resultBox){resultBox.hidden=false;resultBox.className='upload-result error';resultBox.textContent=msg;}
    if(closeBtn){closeBtn.disabled=false;closeBtn.textContent='Close';}
    toast(msg);
  }
}

function excelDate(v){
  if(v==null||v==='')return '';
  // Excel may store dates as serial numbers (or numeric strings).
  if(typeof v==='number'||(/^\d+(?:\.\d+)?$/.test(String(v).trim()))){
    const n=Number(v);
    if(Number.isFinite(n)&&n>20000&&n<80000){
      const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000);
      return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10);
    }
  }
  const s=String(v).trim();
  // Already ISO formatted.
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:$|T|\s)/);
  if(m){
    const y=Number(m[1]),mo=Number(m[2]),day=Number(m[3]);
    const d=new Date(Date.UTC(y,mo-1,day));
    return d.getUTCFullYear()===y&&d.getUTCMonth()===mo-1&&d.getUTCDate()===day?`${y}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`:'';
  }
  // This workbook uses US month/day/year values, e.g. 4/26/2024.
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if(m){
    const mo=Number(m[1]),day=Number(m[2]);let y=Number(m[3]);
    if(y<100)y+=y>=70?1900:2000;
    const d=new Date(Date.UTC(y,mo-1,day));
    return mo>=1&&mo<=12&&day>=1&&d.getUTCFullYear()===y&&d.getUTCMonth()===mo-1&&d.getUTCDate()===day?`${y}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`:'';
  }
  m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3,9})[-\s,]+(\d{2,4})$/);
  if(m){
    const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    const mo=months[m[2].slice(0,3).toLowerCase()];let y=Number(m[3]);if(y<100)y+=y>=70?1900:2000;
    const day=Number(m[1]);if(mo){const d=new Date(Date.UTC(y,mo-1,day));if(d.getUTCFullYear()===y&&d.getUTCMonth()===mo-1&&d.getUTCDate()===day)return `${y}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}
  }
  return '';
}

async function fetchAll(table){
  let out=[],from=0;

  while(true){
    const {data,error}=await sb
      .from(table)
      .select('id,source_file_id,sheet_name,row_number,data,is_active,created_at')
      .eq('is_active',true)
      .order('created_at',{ascending:false})
      .range(from,from+999);

    if(error)throw error;

    out=out.concat(data||[]);

    if(!data||data.length<1000)break;
    from+=1000;
  }

  return out;
}
